events {}

http {
    upstream ws01_cluster {
        hash $cookie_.WS01_01.Session consistent;
        server ws01-node1:8080;
        server ws01-node2:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://ws01_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}