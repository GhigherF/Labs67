events {}

http {
    upstream ws02_cluster {
        server ws02-node1:8080;
        server ws02-node2:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://ws02_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}